name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://todo:todo@localhost:5432/todo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  # Builds the images, starts the whole stack, and validates deploy idempotency and every
  # security layer against it.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: docker compose version
      # Build, then start, as a deploy does: with the classic image store, a container started by
      # `up --build` is labelled with a different image reference than a later `up` resolves, so
      # the next converge would recreate it once.
      - run: docker compose build
      - run: docker compose up -d --wait
      # First, on the fresh stack, so the new-account empty list is checked too.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: ./scripts/validate-deploy.sh
      - run: ./scripts/validate-security.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
