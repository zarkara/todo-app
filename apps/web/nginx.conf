server {
  # Unprivileged image: nginx runs as a non-root user, so it listens on a high port.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Inherited by every location below, because none of them sets add_header itself.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Same-origin API: the browser never talks to the API container directly, so no CORS.
  # Look the API up at request time (cached 5 s), not once at start-up: a replaced API container
  # gets a new address. NGINX_LOCAL_RESOLVERS comes from /etc/resolv.conf (the image's entrypoint).
  resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

  # API_UPSTREAM is filled in at start-up (nginx's envsubst templates): http://api:4000 in compose,
  # the API app's internal address on Azure Container Apps, which routes by Host.
  location /api/ {
    set $api_upstream ${API_UPSTREAM};
    # With a variable upstream nginx passes the URI as is, so strip the /api prefix here.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The API (helmet) sends its own copies; keep only the ones nginx adds above.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
  }

  # Vite fingerprints asset file names, so they can be cached forever.
  location /assets/ {
    expires 1y;
  }

  location = /index.html {
    expires -1;
  }

  # Client-side routes such as /tasks/123 all serve the app shell.
  location / {
    try_files $uri /index.html;
  }
}
