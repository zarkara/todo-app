server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Inherited by every location below, because none of them sets add_header itself.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Same-origin API: the browser never talks to the API container directly, so no CORS.
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints asset file names, so they can be cached forever.
  location /assets/ {
    expires 1y;
  }

  location = /index.html {
    expires -1;
  }

  # Client-side routes such as /tasks/123 all serve the app shell.
  location / {
    try_files $uri /index.html;
  }
}
